<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e8">
  <title>Zeynep & Ahmet | Nikah Davetiyesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-bg"></div>
  <div class="dots"></div>

  <main class="page">
    <section class="hero">
      <p class="names">Zeynep & Ahmet</p>
      <h1>Nikah Davetiyesi</h1>
      <p class="intro">Bu özel günümüzde sizleri de aramızda görmekten mutluluk duyarız.</p>

      <div class="stage">
        <div class="envelope" id="envelope" aria-label="Nikah davetiyesi zarfı">
          <div class="envelope-back"></div>

          <div class="letter">
            <img src="davetiye.png" alt="Zeynep ve Ahmet nikah davetiyesi">
          </div>

          <div class="envelope-front"></div>
          <div class="envelope-flap"></div>
          <div class="seal">ZA</div>
        </div>
      </div>

      <button class="open-btn" id="openBtn" type="button">Zarfı Aç</button>
    </section>

    <section class="details" id="details" aria-hidden="true">
      <div class="card countdown-card">
        <p class="card-title">Büyük güne kalan</p>
        <div class="countdown">
          <div><strong id="days">00</strong><span>Gün</span></div>
          <div><strong id="hours">00</strong><span>Saat</span></div>
          <div><strong id="minutes">00</strong><span>Dakika</span></div>
          <div><strong id="seconds">00</strong><span>Saniye</span></div>
        </div>
      </div>

      <div class="card info-card">
        <div class="info-row"><span>📅</span><div><small>Tarih</small><strong>4 Eylül 2026</strong></div></div>
        <div class="info-row"><span>🕞</span><div><small>Saat</small><strong>15:30</strong></div></div>
        <div class="info-row"><span>📍</span><div><small>Yer</small><strong>Bornova Nikah Salonu</strong></div></div>
      </div>

      <div class="actions">
        <a href="https://www.google.com/maps/search/?api=1&query=Bornova+Nikah+Salonu" target="_blank" rel="noopener">📍 Konuma Git</a>
        <button type="button" id="calendarBtn">📅 Takvime Ekle</button>
        <a href="https://wa.me/?text=Zeynep%20ve%20Ahmet%27in%204%20Eyl%C3%BCl%202026%20tarihindeki%20nikah%C4%B1na%20kat%C4%B1laca%C4%9F%C4%B1m." target="_blank" rel="noopener">✓ Katılım Onayı</a>
      </div>

      <p class="closing">Sevgiyle bekliyoruz</p>
      <p class="signature">Zeynep & Ahmet</p>
    </section>
  </main>

  <div class="confetti-layer" id="confettiLayer"></div>
  <script src="script.js"></script>
</body>
</html>
