
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zeynep & Ahmet | Nikâh Davetiyesi</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="invitation-scene" id="invitationScene">

      <div class="envelope">

        <div class="envelope-back"></div>

        <article class="invitation-card">

          <p class="small-title">
            BİRLİKTE YAZDIĞIMIZ
          </p>

          <p class="small-title">
            EN GÜZEL HİKÂYE BAŞLIYOR
          </p>

          <div class="heart">♡</div>

          <h1>Z A</h1>

          <h2>Zeynep & Ahmet</h2>

          <p class="message">
            Bu özel günümüzde sizleri de aramızda görmekten
            mutluluk duyarız.
          </p>

          <div class="divider"></div>

          <div class="details">

            <div class="detail">
              <span class="icon">♡</span>
              <strong>TARİH</strong>
              <p>4 Eylül 2026</p>
            </div>

            <div class="detail">
              <span class="icon">◷</span>
              <strong>SAAT</strong>
              <p>15:30</p>
            </div>

            <div class="detail">
              <span class="icon">⌖</span>
              <strong>YER</strong>
              <p>Bornova Nikah Salonu</p>
            </div>

          </div>

          <p class="footer-text">
            Sizleri bekliyoruz
          </p>

        </article>

        <div class="envelope-flap"></div>

        <div class="envelope-front"></div>

        <div class="seal">
          ZA
        </div>

      </div>

      <button
        class="open-button"
        id="openButton"
        type="button"
      >
        Zarfı Aç
      </button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
