<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f3e8">
<title>Zeynep & Ahmet | Nikah Davetiyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#f8f3e8; --paper:#fffdf8; --gold:#c69b45;
  --green:#5d704f; --green-dark:#46583c; --text:#3f382f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--text);background:var(--cream);font-family:"Cormorant Garamond",Georgia,serif}
button,a{font:inherit}
.bg{position:fixed;inset:0;z-index:-3;background:
radial-gradient(circle at 18% 18%,rgba(198,155,69,.14),transparent 30%),
radial-gradient(circle at 82% 74%,rgba(93,112,79,.12),transparent 32%),
linear-gradient(180deg,#fffdf8,#f5ede0)}
.dots{position:fixed;inset:0;z-index:-2;opacity:.38;pointer-events:none;background-image:radial-gradient(circle,rgba(198,155,69,.55) 1.2px,transparent 1.5px);background-size:70px 70px}
.hero{min-height:100svh;padding:max(34px,env(safe-area-inset-top)) 16px 56px;display:flex;flex-direction:column;align-items:center;text-align:center}
.names{margin:0;color:var(--gold);font-family:"Great Vibes",cursive;font-size:clamp(38px,10vw,60px)}
h1{margin:2px 0 0;font-size:clamp(30px,8vw,46px);font-weight:500}
.intro{width:min(94%,580px);margin:10px 0 18px;font-size:clamp(18px,4.7vw,23px);line-height:1.4;color:rgba(63,56,47,.78)}
.stage{width:100%;display:grid;place-items:center;padding-top:90px}
.envelope{position:relative;width:min(92vw,590px);aspect-ratio:1.48/1;perspective:1600px}
.back{position:absolute;inset:0;z-index:1;border-radius:9px;background:#e5cd9c;box-shadow:0 25px 50px rgba(71,55,34,.22)}
.letter{position:absolute;left:50%;bottom:5%;width:min(61%,340px);aspect-ratio:2/3;z-index:2;overflow:hidden;border-radius:18px;background:var(--paper);box-shadow:0 14px 34px rgba(58,45,28,.24);transform:translateX(-50%);transition:transform 1.1s cubic-bezier(.22,1,.36,1),width .8s ease,z-index 0s linear .48s}
.letter img{display:block;width:100%;height:100%;object-fit:cover}
.front{position:absolute;inset:0;z-index:4;overflow:hidden;border-radius:9px;pointer-events:none}
.front:before,.front:after{content:"";position:absolute;bottom:0;width:52%;height:100%;background:#efddb5}
.front:before{left:0;clip-path:polygon(0 0,100% 51%,100% 100%,0 100%)}
.front:after{right:0;clip-path:polygon(100% 0,0 51%,0 100%,100% 100%)}
.flap{position:absolute;top:0;left:0;width:100%;height:59%;z-index:5;transform-origin:top center;transform:rotateX(0);clip-path:polygon(0 0,50% 100%,100% 0);background:linear-gradient(160deg,#edd9ad,#ddc18a);backface-visibility:hidden;transition:transform .95s cubic-bezier(.22,1,.36,1),z-index 0s linear .46s}
.seal{position:absolute;left:50%;top:50%;z-index:6;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#d4af5c,#aa7c2e);font-family:"Great Vibes",cursive;font-size:34px;box-shadow:0 11px 24px rgba(111,76,22,.35);transform:translate(-50%,-50%);transition:opacity .35s ease,transform .35s ease}
.envelope.open .flap{z-index:1;transform:rotateX(180deg)}
.envelope.open .letter{z-index:7;width:min(73%,390px);transform:translate(-50%,-52%)}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-20deg)}
.open-btn{z-index:20;min-width:210px;margin-top:58px;padding:16px 34px;border:0;border-radius:999px;color:#fff;background:linear-gradient(145deg,var(--green),var(--green-dark));font-size:clamp(23px,6vw,30px);box-shadow:0 13px 28px rgba(69,87,59,.25);cursor:pointer}
.details{width:min(92%,720px);margin:0 auto;padding:20px 0 80px;opacity:0;visibility:hidden;transform:translateY(34px);transition:opacity .75s ease,transform .75s ease,visibility .75s}
.details.visible{opacity:1;visibility:visible;transform:translateY(0)}
.card{border:1px solid rgba(198,155,69,.25);border-radius:24px;background:rgba(255,253,248,.92);box-shadow:0 18px 38px rgba(79,63,42,.12)}
.count-card{padding:24px 14px;text-align:center}
.card-title{margin:0 0 17px;color:var(--gold);font-size:20px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.countdown div{padding:14px 4px;border-radius:16px;background:#f5eddf}
.countdown strong{display:block;color:var(--green-dark);font-size:clamp(25px,8vw,42px);line-height:1}
.countdown span{display:block;margin-top:7px;font-size:clamp(12px,3.6vw,16px)}
.info-card{margin-top:20px;padding:8px 20px}
.info-row{min-height:84px;display:flex;align-items:center;gap:15px;border-bottom:1px solid rgba(198,155,69,.18)}
.info-row:last-child{border-bottom:0}
.info-row>span{width:46px;height:46px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:#f3e7cf;font-size:22px}
.info-row small{display:block;color:rgba(63,56,47,.62);font-size:15px}
.info-row strong{display:block;font-size:clamp(19px,5vw,24px)}
.actions{margin-top:22px;display:grid;gap:12px}
.actions a,.actions button{min-height:60px;padding:13px 20px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-size:21px;box-shadow:0 10px 22px rgba(69,87,59,.18);cursor:pointer}
.closing{margin:40px 0 0;text-align:center;font-size:21px;color:rgba(63,56,47,.72)}
.signature{margin:0;text-align:center;color:var(--gold);font-family:"Great Vibes",cursive;font-size:46px}
.confetti-layer{position:fixed;inset:0;z-index:50;overflow:hidden;pointer-events:none}
.confetti{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{opacity:0;transform:translateY(110vh) rotate(720deg)}}
@media(min-width:680px){.actions{grid-template-columns:repeat(3,1fr)}.actions a,.actions button{font-size:18px}}
@media(max-width:600px){.hero{padding-top:32px}.stage{padding-top:102px}.envelope{width:93vw}.seal{width:70px;height:70px;font-size:30px}.envelope.open .letter{width:min(75%,345px);transform:translate(-50%,-50%)}.open-btn{margin-top:60px}}
</style>
</head>
